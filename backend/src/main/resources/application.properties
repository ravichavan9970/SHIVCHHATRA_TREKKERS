server.port=8080

# Enterprise Persistent Database Configuration (Supports Cloud PostgreSQL with Local File H2 Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/shivchhatradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ShivPasss!****2026}

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Embedded H2 Database Web Inspector Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# File Upload & Large Payload Size Limits (50MB for photos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# Ultra-Secure Application Security & Admin Secret Token
shivchhatra.admin.passcode=ShivPasss!****2026
shivchhatra.admin.secret=ShivPasss!****2026
