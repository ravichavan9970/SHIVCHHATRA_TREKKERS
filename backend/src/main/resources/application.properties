server.port=8080

# Persistent Disk-based Relational Database Configuration
spring.datasource.url=jdbc:h2:file:./data/shivchhatradb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=shivchhatra2026

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Embedded H2 Database Web Inspector Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File Upload & Large Payload Size Limits (50MB for photos)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# Application Security & Admin Secret Token
shivchhatra.admin.passcode=shivchhatra2026
shivchhatra.admin.secret=shivchhatra-sahyadri-secret-master-token-key-2026
